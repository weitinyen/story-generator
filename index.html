<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎯 靶心人公式 - 我的升學故事學習單產生器</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #f0f4f9;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .gemini-card {
      background: #ffffff;
      border-radius: 1.5rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8 text-slate-800">

  <!-- Gemini Header Bar -->
  <header class="max-w-5xl mx-auto mb-6 flex justify-between items-center px-2">
    <div class="flex items-center gap-2 text-xl font-bold text-slate-700">
      <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 0L14.59 9.41L24 12L14.59 14.59L12 24L9.41 14.59L0 12L9.41 9.41L12 0Z" fill="url(#gemini-grad)"/>
        <defs>
          <linearGradient id="gemini-grad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#4285F4"/>
            <stop offset="50%" stop-color="#9B51E0"/>
            <stop offset="100%" stop-color="#E91E63"/>
          </linearGradient>
        </defs>
      </svg>
      <span>Gemini</span>
    </div>

    <!-- 進階 API 設定（可選） -->
    <details class="relative">
      <summary class="cursor-pointer bg-white px-3 py-1.5 rounded-full text-xs font-medium text-slate-600 border border-slate-200 shadow-sm hover:bg-slate-50 list-none flex items-center gap-1.5">
        <i class="fa-solid fa-gear text-slate-400"></i>
        <span>進階 AI 設定</span>
      </summary>
      <div class="absolute right-0 mt-2 w-80 bg-white rounded-2xl shadow-xl p-4 border border-slate-100 z-50">
        <label class="block text-xs font-bold text-slate-700 mb-1">Gemini API Key (選填)：</label>
        <input type="password" id="apiKeyInput" placeholder="貼上 AIzaSy... 或 AQ.Ab... 金鑰" class="w-full text-xs p-2.5 rounded-lg border border-slate-200 focus:outline-none focus:border-blue-500 mb-2 font-mono">
        <p class="text-[11px] text-slate-400 leading-normal">
          💡 <strong>學生使用提示：</strong>直接留白即可！系統會自動啟用「智能語意解析引擎」，根據您輸入的特定科目與做法動態推演故事。
        </p>
      </div>
    </details>
  </header>

  <!-- Main Container -->
  <main class="max-w-5xl mx-auto gemini-card p-6 md:p-10 mb-10">
    <div class="text-center mb-8">
      <h1 class="text-2xl md:text-3xl font-extrabold text-slate-800 tracking-tight mb-2">
        AI 驅動的 靶心人公式升學故事產生器
      </h1>
      <p class="text-slate-500 text-sm md:text-base">
        輸入您的想法，讓 AI 協助您建構前後邏輯貫通的國三會考/模考逆襲故事與學習單。
      </p>
    </div>

    <!-- Action Buttons -->
    <div class="flex flex-wrap items-center justify-center gap-3 mb-8">
      <button onclick="triggerAIGeneration()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-5 py-2.5 rounded-xl text-sm shadow-sm transition flex items-center gap-2">
        <i class="fa-solid fa-wand-magic-sparkles text-amber-300"></i>
        <span>✨ AI 智慧推演與生成</span>
      </button>
      <button onclick="loadBiriGyalPreset()" class="bg-amber-500 hover:bg-amber-600 text-white font-medium px-5 py-2.5 rounded-xl text-sm shadow-sm transition flex items-center gap-2">
        <i class="fa-solid fa-book"></i>
        <span>📙 墊底辣妹範例</span>
      </button>
      <button onclick="unlockAttachments()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-5 py-2.5 rounded-xl text-sm shadow-sm transition flex items-center gap-2">
        <i class="fa-solid fa-paper-plane"></i>
        <span>🚀 產生試算表與學習單</span>
      </button>
      <button onclick="clearAllFields()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium px-4 py-2.5 rounded-xl text-sm transition flex items-center gap-2">
        <i class="fa-solid fa-rotate-right"></i>
        <span>🧹 清除</span>
      </button>
    </div>

    <!-- 7 Step Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8" id="stepsContainer">
      <!-- JS 動態渲染卡片 -->
    </div>
  </main>

  <!-- Attachment Section -->
  <section id="attachmentSection" class="max-w-5xl mx-auto space-y-8 hidden mb-12">
    <!-- Google Sheets Preview & Launcher -->
    <div class="gemini-card p-6 md:p-8">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
        <div>
          <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
            <i class="fa-solid fa-table text-emerald-600"></i>
            <span>彩虹情緒試算表預覽</span>
          </h2>
          <p class="text-xs text-slate-500">已成功生成 7 步驟事件、感受與情緒帶狀區塊標記</p>
        </div>
        <button onclick="openGoogleSheetsWindow()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-5 py-2.5 rounded-xl text-sm shadow-sm transition flex items-center gap-2">
          <i class="fa-solid fa-file-excel"></i>
          <span>📊 一鍵生成 Google 試算表（另開分頁呈現）</span>
        </button>
      </div>

      <div class="overflow-x-auto rounded-xl border border-slate-200 custom-scrollbar">
        <table class="w-full text-left text-xs border-collapse">
          <thead>
            <tr class="bg-emerald-800 text-white font-bold">
              <th class="p-3 w-24 border-r border-emerald-700">步驟</th>
              <th class="p-3 w-48 border-r border-emerald-700">關鍵事件</th>
              <th class="p-3 w-48 border-r border-emerald-700">內心感受</th>
              <th class="p-3 text-center border-r border-emerald-700" style="background:#059669;">+3<br><span class="text-[9px]">狂喜</span></th>
              <th class="p-3 text-center border-r border-emerald-700" style="background:#10b981;">+2<br><span class="text-[9px]">期待</span></th>
              <th class="p-3 text-center border-r border-emerald-700" style="background:#34d399;">+1<br><span class="text-[9px]">希望</span></th>
              <th class="p-3 text-center border-r border-emerald-700" style="background:#9ca3af;">0<br><span class="text-[9px]">平靜</span></th>
              <th class="p-3 text-center border-r border-emerald-700" style="background:#f87171;">-1<br><span class="text-[9px]">不安</span></th>
              <th class="p-3 text-center border-r border-emerald-700" style="background:#ef4444;">-2<br><span class="text-[9px]">沮喪</span></th>
              <th class="p-3 text-center" style="background:#dc2626;">-3<br><span class="text-[9px]">崩潰</span></th>
            </tr>
          </thead>
          <tbody id="rainbowGridBody" class="divide-y divide-slate-200 bg-white"></tbody>
        </table>
      </div>
    </div>

    <!-- Full Story Narrative -->
    <div class="gemini-card p-6 md:p-8">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-book-open text-blue-600"></i>
          <span>連貫貫通全文故事</span>
        </h2>
        <button onclick="copyToClipboard('fullStoryText')" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium px-3 py-1.5 rounded-lg transition">
          <i class="fa-regular fa-copy"></i> 複製全文
        </button>
      </div>
      <div id="fullStoryText" class="bg-slate-50 p-5 rounded-xl text-sm text-slate-700 leading-relaxed border border-slate-200 whitespace-pre-line font-serif"></div>
    </div>
  </section>

  <script>
    const stepsData = [
      { id: 1, name: "1. 目標 (Goal)", isReq: true, pE: "例如：考上第一志願高雄中學、英文拿到 A++", pF: "例如：熱血期待，心中充滿證明自己的決心", defS: "3" },
      { id: 2, name: "2. 阻礙 (Obstacle)", isReq: true, pE: "例如：數學與理化成績墊底，常被同學嘲笑", pF: "例如：沮喪挫折，深深體會到課業壓力", defS: "-2" },
      { id: 3, name: "3. 努力 (Effort)", isReq: true, pE: "例如：刪除手機遊戲，每天早起 30 分鐘刷題背單字", pF: "例如：踏實專注，一步一腳印積累實力", defS: "1" },
      { id: 4, name: "4. 結果 (Result)", isReq: false, pE: "例如：模擬考成績獲得顯著突破，順利邁向前段班！", pF: "例如：振奮狂喜，重新建立起信心。", defS: "2" },
      { id: 5, name: "5. 意外 (Accident)", isReq: false, pE: "例如：會考前夕模擬考突遇題型變化大幅失常滑鐵盧。", pF: "例如：崩潰絕望，極度焦慮與不安。", defS: "-3" },
      { id: 6, name: "6. 轉彎 (Twist)", isReq: false, pE: "例如：在家人溫暖陪伴與老師真摯鼓勵下重整旗鼓。", pF: "例如：重獲力量，找回沉著平靜的心態。", defS: "1" },
      { id: 7, name: "7. 結局 (Ending)", isReq: false, pE: "例如：會考放榜成功逆襲錄取第一志願目標！", pF: "例如：感動落淚，充滿狂喜與自我肯定。", defS: "3" }
    ];

    const emotionOptions = [
      { v: "3", t: "3 (狂喜/自信)" },
      { v: "2", t: "2 (期待/振奮)" },
      { v: "1", t: "1 (希望/踏實)" },
      { v: "0", t: "0 (平靜/沉著)" },
      { v: "-1", t: "-1 (不安/焦慮)" },
      { v: "-2", t: "-2 (沮喪/挫折)" },
      { v: "-3", t: "-3 (崩潰/絕望)" }
    ];

    function renderCards() {
      const container = document.getElementById('stepsContainer');
      container.innerHTML = stepsData.map(s => `
        <div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm relative">
          <div class="flex items-center justify-between mb-3">
            <h3 class="font-bold text-slate-800 text-sm md:text-base">${s.name}</h3>${s.isReq ? '<span class="text-[11px] bg-blue-100 text-blue-600 font-medium px-2.5 py-0.5 rounded-md">必填</span>' : '<span class="text-[11px] bg-slate-100 text-slate-500 font-medium px-2.5 py-0.5 rounded-md">AI推演</span>'}
          </div>

          <div class="space-y-3">
            <textarea id="event_${s.id}" rows="2" placeholder="${s.pE}" class="w-full p-3 text-xs bg-slate-50/50 rounded-xl border border-slate-200/80 focus:outline-none focus:border-blue-500 transition resize-none custom-scrollbar" oninput="limitSentences(this)"></textarea>

            <div class="flex gap-2">
              <input id="feeling_${s.id}" type="text" placeholder="${s.pF}" class="w-2/3 p-2.5 text-xs bg-slate-50/50 rounded-xl border border-slate-200/80 focus:outline-none focus:border-blue-500 transition" oninput="limitSentences(this)">
              <select id="scale_${s.id}" class="w-1/3 p-2.5 text-xs bg-slate-50/50 rounded-xl border border-slate-200/80 focus:outline-none focus:border-blue-500 font-medium text-slate-700">
                ${emotionOptions.map(o => `<option value="${o.v}" ${o.v === s.defS ? 'selected' : ''}>${o.t}</option>`).join('')}
              </select>
            </div>
          </div>
        </div>
      `).join('');
    }

    function limitSentences(el) {
      const sentences = el.value.split(/(?<=[。！？!?\n])/).filter(s => s.trim().length > 0);
      if (sentences.length > 3) el.value = sentences.slice(0, 3).join('');
    }

    function loadBiriGyalPreset() {
      const data = [
        { id: 1, e: "在補習班坪田老師建議下，立下考上慶應義塾大學的目標。", f: "心中充滿證明自己的決心與對未來的憧憬。", s: "3" },
        { id: 2, e: "高中成績墊底、偏差值僅 30，被班導師嘲笑是垃圾。", f: "深刻體會到被外界看輕的自卑與不甘。", s: "-2" },
        { id: 3, e: "毅然剪短長髮、戒掉夜遊社交，每天在補習班苦讀至深夜。", f: "一步一腳印積累實力，感覺踏實而專注。", s: "1" },
        { id: 4, e: "半年後模擬考成績大幅躍進，獲得媽媽與夥伴的極大肯定。", f: "重新建立起強烈的自信與期待。", s: "2" },
        { id: 5, e: "考前全國模考重挫跌回 E 判定，長期高壓讓她陷入崩潰絕望。", f: "懷疑過去所有的努力都是徒勞無功。", s: "-3" },
        { id: 6, e: "媽媽溫暖陪伴加上坪田老師信件鼓勵，讓她重燃鬥志再出發。", f: "找回平靜沉著與堅定不移的決心。", s: "1" },
        { id: 7, e: "放榜驚喜錄取慶應大學！當初嗆她若考上就倒立裸體繞操場的班導師震撼不已並甘服敗北。", f: "充滿感動落淚的狂喜與自我肯定。", s: "3" }
      ];

      data.forEach(item => {
        document.getElementById(`event_${item.id}`).value = item.e;
        document.getElementById(`feeling_${item.id}`).value = item.f;
        document.getElementById(`scale_${item.id}`).value = item.s;
      });
    }

    function clearAllFields() {
      for (let i = 1; i <= 7; i++) {
        document.getElementById(`event_${i}`).value = '';
        document.getElementById(`feeling_${i}`).value = '';
        document.getElementById(`scale_${i}`).value = '0';
      }
      document.getElementById('attachmentSection').classList.add('hidden');
    }

    async function triggerAIGeneration() {
      for (let i = 1; i <= 3; i++) {
        const e = document.getElementById(`event_${i}`).value.trim();
        const f = document.getElementById(`feeling_${i}`).value.trim();
        if (!e || !f) {
          alert(`請先完成步驟 ${i} 的「關鍵事件」與「內心感受」！`);
          return;
        }
      }

      const apiKey = document.getElementById('apiKeyInput').value.trim();
      if (apiKey) {
        try {
          await generateWithGemini(apiKey);
        } catch(err) {
          console.error("Gemini API Error:", err);
          alert("Gemini API 連線失敗（錯誤：" + err.message + "），自動切換為「智能語意解析引擎」產出。");
          generateSmartLocalStory();
        }
      } else {
        generateSmartLocalStory();
      }
    }

    // 動態智能語意解析引擎（免 Key 時自動根據輸入關鍵字推演）
    function generateSmartLocalStory() {
      const e1 = document.getElementById('event_1').value;
      const e2 = document.getElementById('event_2').value;
      const e3 = document.getElementById('event_3').value;

      // 1. 識別學科
      let subject = "相關學科";
      if (e1.includes("數學") || e2.includes("數學") || e3.includes("數學")) subject = "數學";
      else if (e1.includes("英文") || e2.includes("英文") || e3.includes("英文")) subject = "英文";
      else if (e1.includes("理化") || e2.includes("理化") || e3.includes("理化")) subject = "理化";
      else if (e1.includes("國文") || e2.includes("國文") || e3.includes("國文")) subject = "國文";
      else if (e1.includes("社會") || e2.includes("社會") || e3.includes("社會")) subject = "社會";
      else if (e1.includes("生物") || e2.includes("生物") || e3.includes("生物")) subject = "生物";

      // 2. 識別策略
      let action = "專注的學習策略";
      if (e3.includes("單字")) action = "天天背單字與文章閱讀";
      else if (e3.includes("錯題") || e3.includes("檢討")) action = "落實錯題本觀念釐清";
      else if (e3.includes("遊戲") || e3.includes("手機") || e3.includes("戒")) action = "戒除娛樂干擾並專心刷題";
      else if (e3.includes("早起") || e3.includes("熬夜") || e3.includes("時間")) action = "嚴格管控作息與時間規劃";
      else if (e3.includes("刷題") || e3.includes("題目")) action = "堅持天天刷題與規律複習";

      // 推演 步驟 4 (結果)
      document.getElementById('event_4').value = `堅持實施「${action}」後，在下一次模擬考中 ${subject} 解題速度與正確率大幅提升！`;
      document.getElementById('feeling_4').value = "驗證了自己的努力沒有白費，重新建立起邁向目標的強烈信心。";
      document.getElementById('scale_4').value = "2";

      // 推演 步驟 5 (意外)
      document.getElementById('event_5').value = `會考前夕最後一次大考，遇到 ${subject} 題型大幅變化與題幹加長，導致時間分配失誤而滑鐵盧。`;
      document.getElementById('feeling_5').value = "陷入巨大的焦慮與自責，極度擔心會考臨場發揮再次失常。";
      document.getElementById('scale_5').value = "-3";

      // 推演 步驟 6 (轉彎)
      document.getElementById('event_6').value = `在師長溫暖鼓勵下回歸基本觀念，並告訴自己「錯題就是會考前的最佳補牌」，及時調整心態。`;
      document.getElementById('feeling_6').value = "放下得失心與恐懼，找回沉著冷靜與踏實的力量。";
      document.getElementById('scale_6').value = "1";

      // 推演 步驟 7 (結局)
      document.getElementById('event_7').value = `會考當天發揮出最佳實力，放榜成功逆襲錄取「${e1.slice(0, 20)}」的目標！`;
      document.getElementById('feeling_7').value = "與家人激動擁抱落淚，充滿對這段逆襲歲月的驕傲與狂喜！";
      document.getElementById('scale_7').value = "3";

      alert("✨ 智能語意引擎已根據您輸入的【" + subject + "】與【" + action + "】自動動態推演連貫劇本！");
    }

    // 真實 Gemini API 呼叫（支援 AQ.Ab... 與 AIzaSy... 全新格式）
    async function generateWithGemini(apiKey) {
      const e1 = document.getElementById('event_1').value;
      const f1 = document.getElementById('feeling_1').value;
      const e2 = document.getElementById('event_2').value;
      const f2 = document.getElementById('feeling_2').value;
      const e3 = document.getElementById('event_3').value;
      const f3 = document.getElementById('feeling_3').value;

      const prompt = `你是一位國中升學導師。請根據學生輸入的 1~3 步驟，推演 4~7 步驟故事。
1. 目標: ${e1} (感受: ${f1})
2. 阻礙: ${e2} (感受: ${f2})
3. 努力: ${e3} (感受: ${f3})

要求：
- 每格 (event, feeling) 限制為 1~3 句。
- 步驟 4~7 必須緊扣學生輸入的特定科目與做法，具備高潮迭起與因果連貫。
- scale 為 -3 到 +3 的數字字串。

請輸出標準 JSON 格式（切勿包含 Markdown 語法如 \`\`\`json）：
{
  "steps": [
    {"id":4, "event":"...", "feeling":"...", "scale":"2"},
    {"id":5, "event":"...", "feeling":"...", "scale":"-3"},
    {"id":6, "event":"...", "feeling":"...", "scale":"1"},
    {"id":7, "event":"...", "feeling":"...", "scale":"3"}
  ]
}`;

      const cleanedKey = apiKey.trim();
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${cleanedKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
      });

      const data = await response.json();
      
      if (!response.ok) {
        throw new Error(data.error?.message || "API 回傳錯誤");
      }

      const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text;
      if (!rawText) throw new Error("無有效文字回傳");

      // 清理可能包含的 Markdown 標記
      const cleanJsonStr = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
      const jsonMatch = cleanJsonStr.match(/\{[\s\S]*\}/);
      
      if (jsonMatch) {
        const parsed = JSON.parse(jsonMatch[0]);
        parsed.steps.forEach(s => {
          if (document.getElementById(`event_${s.id}`)) {
            document.getElementById(`event_${s.id}`).value = s.event;
            document.getElementById(`feeling_${s.id}`).value = s.feeling;
            document.getElementById(`scale_${s.id}`).value = s.scale;
          }
        });
        alert("✨ 真實 Gemini AI 動態推演成功！");
      } else {
        throw new Error("無法解析回傳之 JSON 內容");
      }
    }

    function unlockAttachments() {
      for (let i = 1; i <= 7; i++) {
        if (!document.getElementById(`event_${i}`).value.trim()) {
          alert(`步驟 ${i} 尚未完成！請先補齊內容或點擊「AI 智慧推演」。`);
          return;
        }
      }

      const tbody = document.getElementById('rainbowGridBody');
      const scales = ["3", "2", "1", "0", "-1", "-2", "-3"];
      tbody.innerHTML = '';

      for (let i = 1; i <= 7; i++) {
        const e = document.getElementById(`event_${i}`).value;
        const f = document.getElementById(`feeling_${i}`).value;
        const s = document.getElementById(`scale_${i}`).value;

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="p-3 font-bold border-r border-slate-200">${stepsData[i-1].name.split(' ')[1]}</td>
          <td class="p-3 border-r border-slate-200">${e}</td>
          <td class="p-3 border-r border-slate-200">${f}</td>
          ${scales.map(sc => `
            <td class="p-3 text-center font-bold border-r border-slate-200 ${sc === s ? 'bg-emerald-500 text-white' : ''}">
              ${sc === s ? '✓' : ''}
            </td>
          `).join('')}
        `;
        tbody.appendChild(tr);
      }

      let narrative = "【我的會考逆襲故事：靶心人 7 步驟全文】\n\n";
      for (let i = 1; i <= 7; i++) {
        narrative += `${stepsData[i-1].name}：${document.getElementById(`event_${i}`).value}\n內心感受：${document.getElementById(`feeling_${i}`).value}\n\n`;
      }
      document.getElementById('fullStoryText').innerText = narrative;

      const sec = document.getElementById('attachmentSection');
      sec.classList.remove('hidden');
      sec.scrollIntoView({ behavior: 'smooth' });
    }

    function copyToClipboard(id) {
      navigator.clipboard.writeText(document.getElementById(id).innerText).then(() => {
        alert("已成功複製全文至剪貼簿！");
      });
    }

    window.onload = renderCards;
  </script>
