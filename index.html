<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎯 靶心人公式 - 我的升學故事學習單產生器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #f0f4f9; font-family: system-ui, -apple-system, sans-serif; }
    .gemini-card { background: #ffffff; border-radius: 1.5rem; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03); }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8 text-slate-800">

  <header class="max-w-5xl mx-auto mb-6 flex justify-between items-center px-2">
    <div class="flex items-center gap-2 text-xl font-bold text-slate-700">
      <span class="text-blue-600">🎯 靶心人公式升學故事 AI 產生器</span>
    </div>
  </header>

  <main class="max-w-5xl mx-auto gemini-card p-6 md:p-10 mb-10">
    <div class="text-center mb-8">
      <h1 class="text-2xl md:text-3xl font-extrabold text-slate-800 tracking-tight mb-2">
        🎯 靶心人公式 - 會考逆襲故事學習單
      </h1>
      <p class="text-slate-500 text-sm md:text-base">
        填寫步驟 1~3，AI 將會**自動優化 1~3 步驟、推演 4~7 步驟**，並生成全文故事、情緒試算表與繪圖提示詞！
      </p>
    </div>

    <!-- Actions -->
    <div class="flex flex-wrap items-center justify-center gap-3 mb-8">
      <button id="aiBtn" onclick="triggerBackendAIGeneration()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-5 py-2.5 rounded-xl text-sm shadow-sm transition flex items-center gap-2">
        <i class="fa-solid fa-wand-magic-sparkles text-amber-300"></i>
        <span id="aiBtnText">✨ AI 智慧推演與生成全文</span>
      </button>

      <!-- 📙 墊底辣妹一鍵載入按鈕 (不觸發 AI，直接填滿欄位與附件) -->
      <button onclick="loadBiriGyalPreset()" class="bg-amber-500 hover:bg-amber-600 text-white font-medium px-5 py-2.5 rounded-xl text-sm shadow-sm transition flex items-center gap-2">
        <i class="fa-solid fa-book"></i>
        <span>📙 墊底辣妹範例</span>
      </button>

      <button onclick="clearAllFields()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium px-4 py-2.5 rounded-xl text-sm">🧹 清除</button>
    </div>

    <!-- 7 Step Inputs -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8" id="stepsContainer"></div>
  </main>

  <!-- Results Section -->
  <section id="attachmentSection" class="max-w-5xl mx-auto space-y-8 hidden mb-12">
    <!-- 1. 彩虹情緒試算表 -->
    <div class="gemini-card p-6 md:p-8">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
        <div>
          <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
            <i class="fa-solid fa-table text-emerald-600"></i>
            <span>彩虹情緒試算表預覽</span>
          </h2>
          <p class="text-xs text-slate-500">自動整理 7 步驟事件、內心感受與情緒區塊標記</p>
        </div>
        <div class="flex flex-wrap gap-2">
          <button onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-4 py-2 rounded-xl text-xs shadow-sm transition flex items-center gap-1.5">
            <i class="fa-solid fa-file-excel"></i>
            <span>📊 下載 Excel (.csv) 可編輯檔</span>
          </button>
          <button onclick="openPDFPrintWindow()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-xl text-xs shadow-sm transition flex items-center gap-1.5">
            <i class="fa-solid fa-file-pdf"></i>
            <span>🖨️ 預覽 / 列印 PDF 學習單</span>
          </button>
        </div>
      </div>

      <div class="overflow-x-auto rounded-xl border border-slate-200 custom-scrollbar">
        <table class="w-full text-left text-xs border-collapse">
          <thead>
            <tr class="bg-emerald-800 text-white font-bold">
              <th class="p-3 w-24 border-r border-emerald-700">步驟</th>
              <th class="p-3 w-48 border-r border-emerald-700">關鍵事件</th>
              <th class="p-3 w-48 border-r border-emerald-700">內心感受</th>
              <th class="p-3 text-center border-r border-emerald-700" style="background:#059669;">+3<br><span class="text-[9px]">狂喜</span></th>
              <th class="p-3 text-center border-r border-emerald-700" style="background:#10b981;">+2<br><span class="text-[9px]">期待</span></th>
              <th class="p-3 text-center border-r border-emerald-700" style="background:#34d399;">+1<br><span class="text-[9px]">希望</span></th>
              <th class="p-3 text-center border-r border-emerald-700" style="background:#9ca3af;">0<br><span class="text-[9px]">平靜</span></th>
              <th class="p-3 text-center border-r border-emerald-700" style="background:#f87171;">-1<br><span class="text-[9px]">不安</span></th>
              <th class="p-3 text-center border-r border-emerald-700" style="background:#ef4444;">-2<br><span class="text-[9px]">沮喪</span></th>
              <th class="p-3 text-center" style="background:#dc2626;">-3<br><span class="text-[9px]">崩潰</span></th>
            </tr>
          </thead>
          <tbody id="rainbowGridBody" class="divide-y divide-slate-200 bg-white"></tbody>
        </table>
      </div>
    </div>

    <!-- 2. 貫穿全文故事 -->
    <div class="gemini-card p-6 md:p-8">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-book-open text-blue-600"></i>
          <span>升學逆襲故事 - 7步驟連貫故事全文</span>
        </h2>
        <button onclick="copyToClipboard('fullStoryText')" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium px-3.5 py-2 rounded-xl shadow-sm">
          <i class="fa-regular fa-copy"></i> 複製全文
        </button>
      </div>
      <div class="bg-slate-50 p-6 rounded-2xl border border-slate-200">
        <h3 id="storyTitle" class="text-base font-bold text-slate-800 mb-3 border-b pb-2">《我的升學逆襲故事》</h3>
        <div id="fullStoryText" class="text-sm text-slate-700 leading-relaxed whitespace-pre-line font-serif"></div>
      </div>
    </div>

    <!-- 3. AI 中英文繪圖 Prompt -->
    <div class="gemini-card p-6 md:p-8 space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
          <span>🎨</span>
          <span>寫實風格 AI 繪圖提示詞 (Photorealistic Prompt)</span>
        </h2>
        <button onclick="copyToClipboard('promptText')" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium px-3.5 py-2 rounded-xl shadow-sm">
          <i class="fa-regular fa-copy"></i> 複製 Prompt
        </button>
      </div>

      <div class="bg-slate-50 p-5 rounded-2xl border border-slate-200 space-y-3">
        <div id="promptText" class="font-mono text-xs text-blue-600 bg-white p-4 rounded-xl border border-slate-200 shadow-inner"></div>
        <p id="promptTranslation" class="text-xs text-slate-500 italic"></p>
      </div>
    </div>
  </section>

  <script>
    // ⚠️ 請填入您的 Google Apps Script 部署 URL：
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzFCFJ7DH6hqWHUmfVq7hocVNiCQJFjqJHI_n3uy8g1lRoEv_vXUmLVMdsEThsnjKQ5/exec"; 

    const stepsData = [
      { id: 1, name: "1. 目標 (Goal)", isReq: true, pE: "例如：考上第一志願高雄中學", pF: "例如：熱血期待，充滿決心", defS: "3" },
      { id: 2, name: "2. 阻礙 (Obstacle)", isReq: true, pE: "例如：數學理化成績墊底常被嘲笑", pF: "例如：沮喪挫折，壓力巨大", defS: "-2" },
      { id: 3, name: "3. 努力 (Effort)", isReq: true, pE: "例如：刪除手遊天天早起刷錯題本", pF: "例如：踏實專注，一步一腳印", defS: "1" },
      { id: 4, name: "4. 結果 (Result)", isReq: false, pE: "AI 動態推演中...", pF: "AI 動態推演中...", defS: "2" },
      { id: 5, name: "5. 意外 (Accident)", isReq: false, pE: "AI 動態推演中...", pF: "AI 動態推演中...", defS: "-3" },
      { id: 6, name: "6. 轉彎 (Twist)", isReq: false, pE: "AI 動態推演中...", pF: "AI 動態推演中...", defS: "1" },
      { id: 7, name: "7. 結局 (Ending)", isReq: false, pE: "AI 動態推演中...", pF: "AI 動態推演中...", defS: "3" }
    ];

    const emotionOptions = [
      { v: "3", t: "3 (狂喜/自信)" },
      { v: "2", t: "2 (期待/振奮)" },
      { v: "1", t: "1 (希望/踏實)" },
      { v: "0", t: "0 (平靜/沉著)" },
      { v: "-1", t: "-1 (不安/焦慮)" },
      { v: "-2", t: "-2 (沮喪/挫折)" },
      { v: "-3", t: "-3 (崩潰/絕望)" }
    ];

    function renderCards() {
      document.getElementById('stepsContainer').innerHTML = stepsData.map(s => `
        <div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm">
          <div class="flex items-center justify-between mb-3">
            <h3 class="font-bold text-slate-800 text-sm md:text-base">${s.name}</h3>
            ${s.isReq ? '<span class="text-[11px] bg-blue-100 text-blue-600 px-2 py-0.5 rounded">必填輸入</span>' : '<span class="text-[11px] bg-amber-100 text-amber-600 px-2 py-0.5 rounded">AI優化/推演</span>'}
          </div>

          <div class="space-y-3">
            <textarea id="event_${s.id}" rows="2" placeholder="${s.pE}" class="w-full p-3 text-xs bg-slate-50/50 rounded-xl border border-slate-200 focus:outline-none focus:border-blue-500 resize-none custom-scrollbar"></textarea>
            <div class="flex gap-2">
              <input id="feeling_${s.id}" type="text" placeholder="${s.pF}" class="w-2/3 p-2.5 text-xs bg-slate-50/50 rounded-xl border border-slate-200 focus:outline-none focus:border-blue-500">
              <select id="scale_${s.id}" class="w-1/3 p-2.5 text-xs bg-slate-50/50 rounded-xl border border-slate-200 font-medium">
                ${emotionOptions.map(o => `<option value="${o.v}" ${o.v === s.defS ? 'selected' : ''}>${o.t}</option>`).join('')}
              </select>
            </div>
          </div>
        </div>
      `).join('');
    }

    // 📙 一鍵載入「墊底辣妹」範例 (不用 AI，直接填寫所有步驟與附件)
    function loadBiriGyalPreset() {
      const presetData = [
        { id: 1, e: "在補習班坪田老師建議下，立下考上慶應義塾大學的目標。", f: "熱血期待，心中充滿證明自己的決心與對未來的憧憬。", s: "3" },
        { id: 2, e: "高中成績墊底、偏差值僅 30，被班導師嘲笑完全不被看好。", f: "沮喪自卑，深刻體會到被外界看輕的挫折與不甘心。", s: "-2" },
        { id: 3, e: "剪短長髮、戒掉手遊與社交，每天在補習班苦讀至深夜。", f: "踏實專注，全力以赴學習。", s: "1" },
        { id: 4, e: "經過半年苦讀，模擬考成績大幅進步衝到前段班！", f: "振奮狂喜，重新建立起信心。", s: "2" },
        { id: 5, e: "大考前夕模擬考重挫跌回 E 判定谷底，加上壓力過大身體不適。", f: "崩潰絕望，懷疑所有努力都是徒勞。", s: "-3" },
        { id: 6, e: "媽媽溫暖陪伴與坪田老師信件鼓勵「有志者事竟成」，重新調整心態。", f: "獲得力量，找回平靜沉著與自信。", s: "1" },
        { id: 7, e: "放榜當天喜獲慶應大學錄取通知！當初嘲笑我的班導師甘服敗北，我與媽媽、老師擁抱落淚大喊我做到了！", f: "感動落淚，充滿狂喜與自我肯定。", s: "3" }
      ];

      // 1. 填滿 1~7 步驟表單
      presetData.forEach(item => {
        document.getElementById(`event_${item.id}`).value = item.e;
        document.getElementById(`feeling_${item.id}`).value = item.f;
        document.getElementById(`scale_${item.id}`).value = item.s;
      });

      // 2. 填滿標題與全文
      document.getElementById('storyTitle').innerText = "《從偏差值30到慶應大學：彩加的奇蹟逆襲故事》";
      document.getElementById('fullStoryText').innerText = 
`【1. 目標】在補習班坪田老師建議下，立下考上慶應義塾大學的目標。（內心感受：熱血期待，心中充滿證明自己的決心與對未來的憧憬。）
【2. 阻礙】高中成績墊底、偏差值僅 30，被班導師嘲笑完全不被看好。（內心感受：沮喪自卑，深刻體會到被外界看輕的挫折與不甘心。）
【3. 努力】剪短長髮、戒掉手遊與社交，每天在補習班苦讀至深夜。（內心感受：踏實專注，全力以赴學習。）
【4. 結果】經過半年苦讀，模擬考成績大幅進步衝到前段班！驗證了努力沒有白費，重新建立起邁向目標的強烈信心。
【5. 意外】然而在大考前夕模擬考重挫跌回 E 判定谷底，加上壓力過大身體不適，巨大的焦慮與自責幾乎將我淹沒。
【6. 轉彎】在媽媽溫暖陪伴與坪田老師信件鼓勵「有志者事竟成」後，我擦乾眼淚重整心態，找回平靜沉著的力量。
【7. 結局】放榜當天喜獲慶應大學錄取通知！那一刻與媽媽、老師激動擁抱落淚，當初嘲笑我的班導師也甘服敗北，為這段歲月感到無比驕傲。`;

      // 3. 填滿 AI 繪圖 Prompt
      document.getElementById('promptText').innerText = 
        "A cinematic photorealistic portrait of a Japanese high school girl with short blonde hair celebrating outside Keio University, joyfully crying with tears of victory, holding an official acceptance letter, hugging her tearful mother and inspiring male tutor warmly under golden hour lighting, 8k, shallow depth of field.";
      document.getElementById('promptTranslation').innerText = 
        "(寫實照片風格。畫面呈現：夕陽光影下的慶應大學校門前，金髮短髮高中女生眼眶泛淚舉著錄取通知書，與溫暖陪伴的母親及補習班老師激動擁抱。電影級質感，8K 高畫質。)";

      // 4. 繪製彩虹試算表並顯示附件區塊
      renderRainbowGrid();
      document.getElementById('attachmentSection').classList.remove('hidden');
      document.getElementById('attachmentSection').scrollIntoView({ behavior: 'smooth' });
    }

    async function triggerBackendAIGeneration() {
      const e1 = document.getElementById('event_1').value.trim();
      const e2 = document.getElementById('event_2').value.trim();
      const e3 = document.getElementById('event_3').value.trim();

      if (!e1 || !e2 || !e3) {
        alert("請先完成步驟 1、2、3 的基礎想法再進行生成！");
        return;
      }

      const btn = document.getElementById('aiBtn');
      const btnText = document.getElementById('aiBtnText');
      btn.disabled = true;
      btnText.innerText = "🤖 後端 Gemini 正在優化與推演中...";

      try {
        const response = await fetch(GAS_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ step1: e1, step2: e2, step3: e3 })
        });

        const data = await response.json();

        if (!data.success) {
          throw new Error(data.error || "後端 API 未回傳成功狀態");
        }

        if (data.steps && Array.isArray(data.steps)) {
          data.steps.forEach(s => {
            if (document.getElementById(`event_${s.id}`)) {
              document.getElementById(`event_${s.id}`).value = s.event;
              document.getElementById(`feeling_${s.id}`).value = s.feeling;
              document.getElementById(`scale_${s.id}`).value = s.scale;
            }
          });
        }

        if (data.story_title) document.getElementById('storyTitle').innerText = data.story_title;
        if (data.full_story) document.getElementById('fullStoryText').innerText = data.full_story;
        if (data.prompt_en) document.getElementById('promptText').innerText = data.prompt_en;
        if (data.prompt_zh) document.getElementById('promptTranslation').innerText = data.prompt_zh;

        renderRainbowGrid();
        document.getElementById('attachmentSection').classList.remove('hidden');
        document.getElementById('attachmentSection').scrollIntoView({ behavior: 'smooth' });

        alert("✨ 後端 Gemini AI 推演成功！已更新 1~7 步驟、故事全文與繪圖提示詞。");

      } catch (err) {
        alert("❌ 生成失敗：\n" + err.message);
      } finally {
        btn.disabled = false;
        btnText.innerText = "✨ AI 智慧推演與生成全文";
      }
    }

    function renderRainbowGrid() {
      const tbody = document.getElementById('rainbowGridBody');
      const scales = ["3", "2", "1", "0", "-1", "-2", "-3"];
      tbody.innerHTML = '';

      for (let i = 1; i <= 7; i++) {
        const e = document.getElementById(`event_${i}`).value;
        const f = document.getElementById(`feeling_${i}`).value;
        const s = document.getElementById(`scale_${i}`).value;

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="p-3 font-bold border-r border-slate-200">${stepsData[i-1].name.split(' ')[1]}</td>
          <td class="p-3 border-r border-slate-200">${e}</td>
          <td class="p-3 border-r border-slate-200">${f}</td>
          ${scales.map(sc => `
            <td class="p-3 text-center font-bold border-r border-slate-200 ${sc === s ? 'bg-emerald-500 text-white' : ''}">
              ${sc === s ? '✓' : ''}
            </td>
          `).join('')}
        `;
        tbody.appendChild(tr);
      }
    }

    // 📊 下載 Excel (.csv) 可編輯檔案
    function exportToExcel() {
      let csvContent = "\uFEFF"; 
      csvContent += "步驟,關鍵事件,內心感受,+3 (狂喜),+2 (期待),+1 (希望),0 (平靜),-1 (不安),-2 (沮喪),-3 (崩潰)\n";

      const scales = ["3", "2", "1", "0", "-1", "-2", "-3"];
      for (let i = 1; i <= 7; i++) {
        const name = stepsData[i-1].name;
        const e = (document.getElementById(`event_${i}`).value || "").replace(/"/g, '""').replace(/\n/g, ' ');
        const f = (document.getElementById(`feeling_${i}`).value || "").replace(/"/g, '""').replace(/\n/g, ' ');
        const s = document.getElementById(`scale_${i}`).value;

        let row = `"${name}","${e}","${f}"`;
        scales.forEach(sc => {
          row += sc === s ? ',"✓"' : ',""';
        });
        csvContent += row + "\n";
      }

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      const url = URL.createObjectURL(blob);
      link.setAttribute("href", url);
      link.setAttribute("download", "靶心人公式_會考逆襲故事學習單.csv");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // 🖨️ 另開乾淨列印 / 匯出 PDF 分頁
    function openPDFPrintWindow() {
      const printWin = window.open('', '_blank');
      let rowsHTML = '';
      const scales = ["3", "2", "1", "0", "-1", "-2", "-3"];

      for (let i = 1; i <= 7; i++) {
        const e = document.getElementById(`event_${i}`).value;
        const f = document.getElementById(`feeling_${i}`).value;
        const s = document.getElementById(`scale_${i}`).value;

        rowsHTML += `
          <tr>
            <td style="padding:8px; border:1px solid #ccc; font-weight:bold;">${stepsData[i-1].name}</td>
            <td style="padding:8px; border:1px solid #ccc;">${e}</td>
            <td style="padding:8px; border:1px solid #ccc;">${f}</td>
            ${scales.map(sc => `
              <td style="padding:8px; border:1px solid #ccc; text-align:center; font-weight:bold; background-color:${sc === s ? '#10b981' : '#ffffff'}; color:${sc === s ? '#ffffff' : '#000000'};">
                ${sc === s ? '✓' : ''}
              </td>
            `).join('')}
          </tr>
        `;
      }

      const titleText = document.getElementById('storyTitle').innerText;
      const fullText = document.getElementById('fullStoryText').innerText;

      printWin.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
          <title>${titleText} - 學習單列印檔</title>
          <style>
            body { font-family: system-ui, sans-serif; margin: 30px; color: #1e293b; }
            .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #0284c7; padding-bottom: 12px; margin-bottom: 20px; }
            h1 { font-size: 20px; margin: 0; color: #0369a1; }
            .btn-print { background: #0284c7; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
            @media print { .btn-print { display: none; } }
            table { width: 100%; border-collapse: collapse; margin-bottom: 24px; font-size: 12px; }
            th { background-color: #0369a1; color: white; padding: 8px; border: 1px solid #0284c7; }
            .story-box { background: #f8fafc; border: 1px solid #cbd5e1; padding: 16px; border-radius: 8px; font-size: 13px; line-height: 1.8; whitespace-pre-line; }
          </style>
        </head>
        <body>
          <div class="header">
            <h1>🎯 靶心人公式 - 我的會考逆襲故事學習單</h1>
            <button class="btn-print" onclick="window.print()">🖨️ 立即列印 / 另存為 PDF</button>
          </div>

          <h2 style="font-size:15px; margin-bottom:10px;">📊 一、彩虹情緒試算表</h2>
          <table>
            <thead>
              <tr>
                <th style="width:110px;">步驟</th>
                <th>關鍵事件</th>
                <th>內心感受</th>
                <th style="background:#059669;">+3 狂喜</th>
                <th style="background:#10b981;">+2 期待</th>
                <th style="background:#34d399;">+1 希望</th>
                <th style="background:#6b7280;">0 平靜</th>
                <th style="background:#f87171;">-1 不安</th>
                <th style="background:#ef4444;">-2 沮喪</th>
                <th style="background:#dc2626;">-3 崩潰</th>
              </tr>
            </thead>
            <tbody>${rowsHTML}</tbody>
          </table>

          <h2 style="font-size:15px; margin-bottom:10px;">📖 二、升學逆襲故事全文自述</h2>
          <div class="story-box">
            <strong style="font-size:14px; color:#0f172a;">${titleText}</strong><br><br>
            ${fullText}
          </div>
        </body>
        </html>
      `);
      printWin.document.close();
    }

    function clearAllFields() {
      for (let i = 1; i <= 7; i++) {
        document.getElementById(`event_${i}`).value = '';
        document.getElementById(`feeling_${i}`).value = '';
        document.getElementById(`scale_${i}`).value = '0';
      }
      document.getElementById('attachmentSection').classList.add('hidden');
    }

    function copyToClipboard(id) {
      navigator.clipboard.writeText(document.getElementById(id).innerText).then(() => alert("已複製！"));
    }

    window.onload = renderCards;
  </script>
</body>
</html>
