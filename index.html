<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎯 靶心人公式 - 我的升學故事學習單產生器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #f0f4f9; font-family: system-ui, -apple-system, sans-serif; }
    .gemini-card { background: #ffffff; border-radius: 1.5rem; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03); }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8 text-slate-800">

  <header class="max-w-5xl mx-auto mb-6 flex justify-between items-center px-2">
    <div class="flex items-center gap-2 text-xl font-bold text-slate-700">
      <span class="text-blue-600">✨ Gemini Story Generator</span>
    </div>

    <details class="relative">
      <summary class="cursor-pointer bg-white px-3 py-1.5 rounded-full text-xs font-medium text-slate-600 border border-slate-200 shadow-sm list-none">
        ⚙️ 進階 AI 設定
      </summary>
      <div class="absolute right-0 mt-2 w-80 bg-white rounded-2xl shadow-xl p-4 border border-slate-100 z-50">
        <label class="block text-xs font-bold text-slate-700 mb-1">Gemini API Key：</label>
        <input type="password" id="apiKeyInput" placeholder="請貼上 AIzaSy... 或 AQ.Ab... 金鑰" class="w-full text-xs p-2.5 rounded-lg border border-slate-200 font-mono mb-2">
        <p class="text-[11px] text-slate-400">💡 填入金鑰即可啟用真實 Gemini 2.0 大模型創作！</p>
      </div>
    </details>
  </header>

  <main class="max-w-5xl mx-auto gemini-card p-6 md:p-10 mb-10">
    <div class="text-center mb-8">
      <h1 class="text-2xl md:text-3xl font-extrabold text-slate-800 mb-2">🎯 靶心人公式 - 會考逆襲故事產生器</h1>
      <p class="text-slate-500 text-sm">輸入步驟 1~3，由 AI 為您即時推演 4~7 步驟故事與繪圖提示詞。</p>
    </div>

    <div class="flex justify-center gap-3 mb-8">
      <button id="aiBtn" onclick="triggerAIGeneration()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-2.5 rounded-xl text-sm shadow-sm transition flex items-center gap-2">
        <span id="aiBtnText">✨ AI 智慧推演與生成</span>
      </button>
      <button onclick="clearAllFields()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium px-4 py-2.5 rounded-xl text-sm">🧹 清除</button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8" id="stepsContainer"></div>
  </main>

  <section id="attachmentSection" class="max-w-5xl mx-auto space-y-8 hidden mb-12">
    <!-- Story Result Box -->
    <div class="gemini-card p-6 md:p-8">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-bold text-slate-800">📖 備審亮點自述 - AI 7步驟全文故事</h2>
        <button onclick="copyText('fullStoryText')" class="text-xs bg-slate-100 px-3 py-1.5 rounded-lg">📋 複製全文</button>
      </div>
      <div class="bg-slate-50 p-5 rounded-2xl border border-slate-200">
        <h3 id="storyTitle" class="text-base font-bold text-slate-800 mb-2 pb-2 border-b"></h3>
        <div id="fullStoryText" class="text-sm text-slate-700 leading-relaxed font-serif whitespace-pre-line"></div>
      </div>
    </div>

    <!-- AI Prompt Box -->
    <div class="gemini-card p-6 md:p-8">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-bold text-slate-800">🎨 寫實風格 AI 繪圖提示詞 (Photorealistic Prompt)</h2>
        <button onclick="copyText('promptText')" class="text-xs bg-slate-100 px-3 py-1.5 rounded-lg">📋 複製 Prompt</button>
      </div>
      <div class="bg-slate-50 p-5 rounded-2xl border border-slate-200 space-y-2">
        <div id="promptText" class="font-mono text-xs text-blue-600 bg-white p-3 rounded-xl border"></div>
        <p id="promptTranslation" class="text-xs text-slate-500 italic"></p>
      </div>
    </div>
  </section>

  <script>
    const stepsData = [
      { id: 1, name: "1. 目標 (Goal)", pE: "例：考上第一志願高雄中學", pF: "例：熱血期待，充滿決心" },
      { id: 2, name: "2. 阻礙 (Obstacle)", pE: "例：數學理化成績墊底常被嘲笑", pF: "例：沮喪挫折，壓力巨大" },
      { id: 3, name: "3. 努力 (Effort)", pE: "例：刪除手遊，天天早起刷錯題本", pF: "例：踏實專注，一步一腳印" },
      { id: 4, name: "4. 結果 (Result)", pE: "AI 推演中...", pF: "AI 推演中..." },
      { id: 5, name: "5. 意外 (Accident)", pE: "AI 推演中...", pF: "AI 推演中..." },
      { id: 6, name: "6. 轉彎 (Twist)", pE: "AI 推演中...", pF: "AI 推演中..." },
      { id: 7, name: "7. 結局 (Ending)", pE: "AI 推演中...", pF: "AI 推演中..." }
    ];

    function renderCards() {
      document.getElementById('stepsContainer').innerHTML = stepsData.map(s => `
        <div class="bg-white rounded-2xl p-5 border border-slate-200">
          <h3 class="font-bold text-slate-800 text-sm mb-3">${s.name}</h3>
          <textarea id="event_${s.id}" rows="2" placeholder="${s.pE}" class="w-full p-2.5 text-xs bg-slate-50 rounded-xl border mb-2 resize-none"></textarea>
          <input id="feeling_${s.id}" type="text" placeholder="${s.pF}" class="w-full p-2.5 text-xs bg-slate-50 rounded-xl border">
        </div>
      `).join('');
    }

    async function triggerAIGeneration() {
      const apiKey = document.getElementById('apiKeyInput').value.trim();
      if (!apiKey) {
        alert("請先點開右上角「進階 AI 設定」貼上您的 Gemini API Key！");
        return;
      }

      const e1 = document.getElementById('event_1').value.trim();
      const e2 = document.getElementById('event_2').value.trim();
      const e3 = document.getElementById('event_3').value.trim();
      if (!e1 || !e2 || !e3) {
        alert("請先填寫步驟 1、2、3 的內容！");
        return;
      }

      const btnText = document.getElementById('aiBtnText');
      btnText.innerText = "🤖 Gemini AI 正在即時創作故事中...";

      const prompt = `你是一位專業故事家。請根據以下學生的逆襲素材：
目標：${e1}
阻礙：${e2}
努力：${e3}

請創作連貫的 4~7 步驟故事，並生成備審文章與 AI 繪圖提示詞。
請務必回傳標準 JSON 格式（切勿包含 Markdown 或 \`\`\`json 標記）：
{
  "step4_event": "...", "step4_feeling": "...",
  "step5_event": "...", "step5_feeling": "...",
  "step6_event": "...", "step6_feeling": "...",
  "step7_event": "...", "step7_feeling": "...",
  "title": "《...》",
  "full_story": "全文約 300 字...",
  "prompt_en": "A photorealistic portrait of...",
  "prompt_zh": "(寫實照片風格...)"
}`;

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error?.message || "API 連線拒絕");

        const text = data.candidates[0].content.parts[0].text;
        const cleanJson = text.replace(/```json/g, '').replace(/```/g, '').trim();
        const json = JSON.parse(cleanJson);

        document.getElementById('event_4').value = json.step4_event;
        document.getElementById('feeling_4').value = json.step4_feeling;
        document.getElementById('event_5').value = json.step5_event;
        document.getElementById('feeling_5').value = json.step5_feeling;
        document.getElementById('event_6').value = json.step6_event;
        document.getElementById('feeling_6').value = json.step6_feeling;
        document.getElementById('event_7').value = json.step7_event;
        document.getElementById('feeling_7').value = json.step7_feeling;

        document.getElementById('storyTitle').innerText = json.title;
        document.getElementById('fullStoryText').innerText = json.full_story;
        document.getElementById('promptText').innerText = json.prompt_en;
        document.getElementById('promptTranslation').innerText = json.prompt_zh;

        document.getElementById('attachmentSection').classList.remove('hidden');
        document.getElementById('attachmentSection').scrollIntoView({ behavior: 'smooth' });
        alert("✨ 成功連線 Gemini AI！故事與 Prompt 已動態生成完畢！");
      } catch (err) {
        alert("❌ 連線失敗，請檢查 API Key 是否正確：\n" + err.message);
      } finally {
        btnText.innerText = "✨ AI 智慧推演與生成";
      }
    }

    function clearAllFields() {
      for (let i = 1; i <= 7; i++) {
        document.getElementById(`event_${i}`).value = '';
        document.getElementById(`feeling_${i}`).value = '';
      }
      document.getElementById('attachmentSection').classList.add('hidden');
    }

    function copyText(id) {
      navigator.clipboard.writeText(document.getElementById(id).innerText).then(() => alert("已複製！"));
    }

    window.onload = renderCards;
  </script>
</body>
</html>
